name: Duty template regression checks
on:
  push:
    branches:
      - fix/duty-approved-templates-20261024
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py duty_blank_safe.py
      - name: Validate all bundled Word templates
        run: |
          python - <<'PY'
          import os, io
          import app
          from docx import Document
          for label, name in app.TEMPLATE_NAMES.items():
              path = os.path.join(app.ASSETS, name)
              payload = open(path, 'rb').read()
              doc = app.validate_template_bytes(payload)
              assert len(doc.tables[0].rows) >= 60
              print(label, len(payload), 'bytes', len(doc.tables[0].rows), 'rows')
          PY
      - name: Verify private Storage upload and readback with mocked Supabase
        run: |
          python - <<'PY'
          import io, os
          from unittest.mock import patch
          import app
          from docx import Document
          original = open(os.path.join(app.ASSETS, app.TEMPLATE_NAMES['平日']), 'rb').read()
          doc = Document(io.BytesIO(original))
          found = False
          for row in doc.tables[0].rows:
              for cell in row.cells:
                  for para in cell.paragraphs:
                      for run in para.runs:
                          if '一線巡邏' in run.text:
                              run.text = run.text.replace('一線巡邏', '測試更新巡邏')
                              found = True
          assert found, 'Original template missing 一線巡邏; test would be inconclusive'
          output = io.BytesIO()
          doc.save(output)
          payload = output.getvalue()
          storage = {}
          class Response:
              def __init__(self, status_code, content=b''):
                  self.status_code = status_code
                  self.content = content
          def post(url, headers=None, data=None, timeout=None):
              assert headers['x-upsert'] == 'true'
              storage['file'] = data
              return Response(200)
          def get(url, headers=None, timeout=None):
              return Response(200, storage['file']) if 'file' in storage else Response(404)
          with patch.object(app, 'SUPABASE_URL', 'https://test.supabase.co'), patch.object(app, 'SUPABASE_KEY', 'test-key'), patch.dict(os.environ, {'TEMPLATE_UPLOAD_TOKEN': 'test-secret'}), patch.object(app.req, 'post', side_effect=post), patch.object(app.req, 'get', side_effect=get):
              client = app.app.test_client()
              denied = client.post('/api/upload-template', data={'type':'平日','file':(io.BytesIO(payload),'edited.docx')}, content_type='multipart/form-data')
              assert denied.status_code == 403, denied.data
              uploaded = client.post('/api/upload-template', data={'type':'平日','file':(io.BytesIO(payload),'edited.docx')}, headers={'X-Template-Upload-Token':'test-secret'}, content_type='multipart/form-data')
              assert uploaded.status_code == 200, uploaded.data
              assert uploaded.json['persistent'] is True
              assert storage['file'] == payload
              result = app.generate_word(dict(onDuty=[],offDuty=[],rocDate='115年11月1日',weekday='日',isHoliday=False,hasSake=False))
              text = '\\n'.join(c.text for row in Document(result).tables[0].rows for c in row.cells)
              assert '測試更新巡邏' in text, 'Uploaded text was overwritten during generation'
          print('Upload, readback, auth, and text persistence passed (mocked Storage)')
          PY
      - name: Check all four upload variants and fail-closed storage errors
        run: |
          python - <<'PY'
          import io, os
          from unittest.mock import patch
          import app
          class Response:
              def __init__(self, status_code, content=b''):
                  self.status_code, self.content = status_code, content
          saved = {}
          def post(url, headers=None, data=None, timeout=None):
              saved[url.split('/')[-1]] = data
              return Response(200)
          def get(url, headers=None, timeout=None):
              name = url.split('/')[-1]
              return Response(200, saved[name]) if name in saved else Response(404)
          with patch.object(app, 'SUPABASE_URL', 'https://test.supabase.co'), patch.object(app, 'SUPABASE_KEY', 'test-key'), patch.dict(os.environ, {'TEMPLATE_UPLOAD_TOKEN':'test-secret'}), patch.object(app.req, 'post', side_effect=post), patch.object(app.req, 'get', side_effect=get):
              client = app.app.test_client()
              for label, name in app.TEMPLATE_NAMES.items():
                  payload = open(os.path.join(app.ASSETS,name),'rb').read()
                  response = client.post('/api/upload-template',data={'type':label,'file':(io.BytesIO(payload),name)},headers={'X-Template-Upload-Token':'test-secret'},content_type='multipart/form-data')
                  assert response.status_code == 200, (label,response.data)
                  assert app.template_bytes(os.path.join(app.ASSETS,name)) == payload, label
              assert len(saved) == 4
          with patch.object(app, 'SUPABASE_URL', 'https://test.supabase.co'), patch.object(app, 'SUPABASE_KEY', 'test-key'), patch.object(app.req, 'get', return_value=Response(403)):
              try:
                  app.template_bytes(os.path.join(app.ASSETS, 'tmpl_平日.docx'))
                  raise AssertionError('403 was silently treated as missing template')
              except RuntimeError:
                  pass
          print('All four upload types and Storage permission failure handling passed')
          PY
      - name: Generate and inspect all four Word output types
        run: |
          python - <<'PY'
          import app
          from docx import Document
          for holiday, sake in ((False,False),(False,True),(True,False),(True,True)):
              data = {'onDuty':[], 'offDuty':[], 'rocDate':'115年11月2日', 'weekday':'一', 'isHoliday':holiday, 'hasSake':sake}
              output = app.generate_word(data)
              doc = Document(output)
              assert doc.tables, (holiday,sake)
              table = doc.tables[0]
              codecol = len(table.columns)-5
              namecol = len(table.columns)-1
              codes = {int(row.cells[codecol].text.strip()):row for row in table.rows if row.cells[codecol].text.strip().isdigit()}
              assert '休(補)假' in codes[19].cells[namecol].text, (holiday,sake)
              assert '公假' in codes[29].cells[namecol].text, (holiday,sake)
          print('All four Word output types generated with required headings')
          PY
      - name: Check custom duty wording survives generation
        run: |
          python - <<'PY'
          import io, os, tempfile
          import app
          from docx import Document
          original = app.get_tmpl(False, False)
          doc = Document(original)
          changed = False
          for row in doc.tables[0].rows:
              for cell in row.cells:
                  for para in cell.paragraphs:
                      for run in para.runs:
                          if '一線巡邏' in run.text:
                              run.text = run.text.replace('一線巡邏','測試巡邏文字')
                              changed = True
          assert changed, 'Template does not contain editable 一線巡邏 text; cannot verify replacement'
          if changed:
              with tempfile.TemporaryDirectory() as d:
                  modified = os.path.join(d, 'tmpl_平日.docx')
                  doc.save(modified)
                  app.validate_template_bytes(open(modified,'rb').read())
                  old_assets = app.ASSETS
                  app.ASSETS = d
                  app.SUPABASE_URL = ''
                  try:
                      data = dict(onDuty=[],offDuty=[],rocDate='115年11月1日',weekday='日',isHoliday=False,hasSake=False)
                      result = app.generate_word(data)
                      text = '\\n'.join(c.text for row in Document(result).tables[0].rows for c in row.cells)
                      assert '測試巡邏文字' in text, 'Custom duty wording was lost'
                  finally:
                      app.ASSETS = old_assets
          PY
  live-storage:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Real private Storage upload readback and cleanup
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import os, hashlib, uuid, requests
          url=os.environ['SUPABASE_URL'].rstrip('/')
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          assert url and key, 'Missing Supabase Actions secrets'
          name='qa-only/'+uuid.uuid4().hex+'.docx'
          payload=open('assets/tmpl_平日.docx','rb').read()
          base=f'{url}/storage/v1/object/duty-templates/{name}'
          headers={'apikey':key,'Authorization':'Bearer '+key}
          uploaded=False
          try:
              r=requests.post(base,headers={**headers,'Content-Type':'application/vnd.openxmlformats-officedocument.wordprocessingml.document'},data=payload,timeout=30)
              assert r.status_code in (200,201),f'upload HTTP {r.status_code}: {r.text[:200]}'
              uploaded=True
              r=requests.get(base.replace('/object/','/object/authenticated/'),headers=headers,timeout=30)
              assert r.status_code==200,f'readback HTTP {r.status_code}'
              assert hashlib.sha256(r.content).digest()==hashlib.sha256(payload).digest(),'Readback differs'
              print('REAL STORAGE UPLOAD AND READBACK PASSED')
          finally:
              if uploaded:
                  r=requests.delete(base,headers=headers,timeout=30)
                  assert r.status_code in (200,204),f'cleanup HTTP {r.status_code}'
                  print('QA test file deleted')
          PY
