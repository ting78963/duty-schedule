name: Word generation from private Storage regression
on:
  push:
    branches: [fix/word-merged-cell-performance-20261024]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Generate Word with absent local template
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python - <<'PY'
          import io, os, zipfile, time
          from unittest.mock import patch
          import app
          from docx import Document
          from pathlib import Path
          data={'rocDate':'115年11月10日','weekday':'二','isHoliday':False,'hasSake':True,'sakeTimes':[],'onDuty':[],'offDuty':[]}
          import requests
          url=os.environ['SUPABASE_URL'].rstrip('/') + '/storage/v1/object/authenticated/duty-templates/weekday_sake.docx'
          key=os.environ['SUPABASE_SERVICE_ROLE_KEY']
          response=requests.get(url,headers={'apikey':key,'Authorization':'Bearer '+key},timeout=25)
          assert response.status_code==200, 'Unable to read private approved QA template: HTTP '+str(response.status_code)
          payload=response.content
          assert zipfile.is_zipfile(io.BytesIO(payload)), 'Private Storage template is not DOCX'
          roster=requests.get(os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/monthly_duty',headers={'apikey':key,'Authorization':'Bearer '+key},params={'date_str':'eq.115年11月10日','limit':'1'},timeout=25)
          assert roster.status_code==200, roster.status_code
          rows=roster.json()
          assert len(rows)==1, 'Saved November 10 roster not found'
          d=rows[0]
          data={'rocDate':d['roc_date'],'weekday':d['weekday'],'isHoliday':d['is_holiday'],'hasSake':d['has_sake'],'sakeTimes':d['sake_times'],'onDuty':d['on_duty'],'offDuty':d['off_duty']}
          assert len(data['onDuty'])+len(data['offDuty'])>=15
          started=time.monotonic()
          with patch.object(app,'get_tmpl',return_value='/no-local-assets/tmpl_平日取酒.docx'), patch.object(app,'template_bytes',return_value=payload):
              response=app.app.test_client().post('/api/generate',json=data)
          elapsed=time.monotonic()-started
          print('Generation elapsed seconds:',round(elapsed,2),flush=True)
          assert elapsed < 20, 'Generation too slow for production worker'
          assert response.status_code==200, response.data[:300]
          assert zipfile.is_zipfile(io.BytesIO(response.data))
          doc=Document(io.BytesIO(response.data))
          assert doc.tables
          table=doc.tables[0]
          assert len(table.rows)>=25, 'Word table has too few rows'
          text=' '.join(cell.text for row in table.rows for cell in row.cells)
          names=[s['name'] for s in data['onDuty']+data['offDuty'] if s.get('name')]
          found=[n for n in names if n in text]
          assert len(found)>=min(10,len(names)), 'Missing real personnel names: '+str(len(found))+'/'+str(len(names))
          assert '休(補)假' in text and '公假' in text, 'Leave section headings missing'
          assert any('19' in cell.text for row in table.rows for cell in row.cells), 'Code 19 missing'
          assert any('29' in cell.text for row in table.rows for cell in row.cells), 'Code 29 missing'
          print('Real personnel verified:',len(found),'of',len(names),flush=True)
          print('DOCX generation from remote-only template passed')
          PY
      - name: Check browser error handling
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path('templates/index.html').read_text()
          start=html.index('async function generateOne(')
          end=html.index('async function generateBatch(',start)
          assert 'if (!res.ok)' in html[start:end]
          assert 'throw new Error' in html[start:end]
          print('Error response is not downloaded as DOCX')
          PY
